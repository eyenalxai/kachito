[package]
name = "kachito"
version = "0.0.1"
edition = "2024"
license = "MIT"

[dependencies]
# Pinned, not floating. b5f8c8f fixes rune#345: GPU timestamps resolve only for observed
# surfaces, and a refused configure replaces the surface instead of panicking. Kachito sets no
# observer, so resizing a window that shows a NativeSurface no longer takes the app down.
rune = { git = "https://github.com/anomalyco/rune", rev = "b5f8c8f394566d7ffb156b618f0dab0bb7465e3a", features = ["native-file-dialog"] }

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
png = "0.18"

[workspace]
